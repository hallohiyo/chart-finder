name: 우량주 바닥 반등 — 실적 + 차트
market: kr
universe: all
description: 재무 우량주 조건에 바닥 반등 차트 신호를 합친 23개 조건.
requires: [fundamentals]
order: 60
conditions:
  # ===== 재무 =====
  # 1. 최근 4년 매출액이 해마다 증가
  - key: revenue_growth
    weight: 2.0
    params: {years: 3, min_growth: 0.0}

  # 2. 영업이익도 해마다 증가
  - key: operating_income_growth
    weight: 2.0
    params: {years: 3, min_growth: 0.0}

  # 3. 영업이익률 양호 (최근 3년 평균 8% 이상)
  - key: operating_margin
    weight: 1.5
    params: {min_margin: 8.0, years: 3}

  # 4. 부채비율 안정 (최근 3년 평균 100% 이하)
  - key: debt_ratio
    weight: 1.5
    params: {max_ratio: 100.0, years: 3}

  # 5. ROE 양호 (최근 3년 평균 10% 이상)
  - key: roe
    weight: 1.5
    params: {min_roe: 10.0, years: 3}

  # 6. 영업현금흐름 3년 연속 플러스
  - key: positive_cash_flow
    weight: 1.5
    params: {years: 3}

  # ===== 차트 =====
  # 1. 볼린저 — 하단 지지, 이탈 후 밴드 복귀
  - key: bb_lower_recovery
    weight: 1.5
    params: {period: 20, mult: 2.0, within: 5}

  # 2. RSI — 과매도 후 30선 상향 돌파
  - key: rsi_oversold
    weight: 1.0
    params: {period: 14, threshold: 35.0}
  - key: rsi_cross_up
    weight: 1.5
    params: {period: 14, threshold: 30.0, within: 5}

  # 3. 거래량 — 3일 연속 30만주 이상 + 거래대금 하한
  - key: volume_floor
    weight: 1.5
    params: {days: 3, min_volume: 300000.0, mode: each}
  - key: min_trading_value
    weight: 1.0
    params: {period: 20, amount: 1000.0}

  # 5. DMI — +DI 상향 돌파 후 간격 확대
  - key: dmi_cross_up
    weight: 1.5
    params: {period: 14, within: 5}
  - key: dmi_spread_widening
    weight: 1.0
    params: {period: 14, lookback: 3, min_spread: 3.0}

  # 6. Slow Stochastic — 과매도권 골든크로스
  - key: stoch_oversold
    weight: 1.0
    params: {period: 14, smooth_k: 3, smooth_d: 3, threshold: 20.0}
  - key: stoch_cross_up
    weight: 1.5
    params: {period: 14, smooth_k: 3, smooth_d: 3, within: 5, max_level: 40.0}

  # 7. 이동평균 — 5일선 상승 전환, 20일선과 수렴 후 골든크로스
  - key: ma_turn_up
    weight: 1.5
    params: {period: 5, within: 3, confirm: 2}
  - key: ma_converging
    weight: 1.0
    params: {short: 5, long: 20, max_gap: 3.0}
  - key: golden_cross
    weight: 1.0
    params: {short: 5, long: 20, within: 5}

  # 8. MACD — 초입 매수신호(히스토그램 상승 전환) + 약세권 골든크로스
  - key: macd_hist_turn_up
    weight: 1.5
    params: {fast: 12, slow: 26, signal: 9, rising_days: 2, below_zero: true}
  - key: macd_cross_up
    weight: 1.5
    params: {fast: 12, slow: 26, signal: 9, within: 5, zone: below}

  # 9. 거래량 — 바닥권에서 증가, 상승 캔들에 동반 증가
  - key: near_low
    weight: 1.0
    params: {period: 252, max_gap: 25.0}
  - key: up_candle_volume
    weight: 1.5
    params: {period: 20, ratio: 1.5, min_gain: 0.0}
