name: 영업이익 급성장 — 이익이 빠르게 늘고 마진도 좋은 회사
market: kr
universe: all
description: 영업이익 연 20% 이상 성장 + 영업이익률 15% 이상 + 마진 개선 + 수급 확인.
requires: [fundamentals, profiles, flows]
order: 6
conditions:
  # ── 영업이익 ─────────────────────────────────────────────────
  # '증가했는가' 가 아니라 '얼마나' 늘었는지를 본다.

  # 1. 영업이익 연평균 성장률 20% 이상 — 성장 속도
  - key: growth_cagr
    weight: 3.5
    params: {item: operating_income, years: 3, min_cagr: 20.0}

  # 2. 가장 최근 연도가 전년 대비 급증했는지 — 가속 (적자 탈출도 잡는다)
  - key: growth_surge
    weight: 3.0
    params: {item: operating_income, min_growth: 30.0}

  # 3. 영업이익률이 높은지 — 많이 팔아 조금 남기는 회사와 구분한다
  - key: operating_margin
    weight: 3.5
    params: {min_margin: 15.0, years: 3}

  # 4. 영업이익률이 나아지는 추세인지 — 매출이 늘어도 마진이 꺾이면 남는 게 없다
  - key: operating_margin_improving
    weight: 2.5
    params: {years: 3, min_step: 1.0}

  # 5. 매출도 같이 늘었는지 — 비용만 줄여 만든 이익은 지속되지 않는다
  - key: revenue_growth
    weight: 2.0
    params: {years: 3, min_growth: 5.0}

  # ── 건전성 ───────────────────────────────────────────────────

  # 6. 장부상 이익이 현금으로 들어오는지
  - key: positive_cash_flow
    weight: 2.5
    params: {years: 3}

  # 7. 빚으로 키운 이익이 아닌지
  - key: debt_ratio
    weight: 2.0
    params: {max_ratio: 120.0, years: 3}

  # 8. 자본잠식이 아닌지
  - key: no_capital_impairment
    weight: 2.0
    params: {min_reserve: 100.0, years: 1}

  # ── 거를 것 ──────────────────────────────────────────────────

  - key: turnover_value
    weight: 1.5
    params: {min_value: 20.0, period: 20}

  - key: low_dilution
    weight: 1.5
    params: {max_pct: 5.0}

  # ── 수급 ─────────────────────────────────────────────────────

  - key: both_net_buy
    weight: 2.5
    params: {days: 5}

  - key: net_buy_ratio
    weight: 2.5
    params: {who: both, days: 20, min_pct: 0.3}

  - key: net_buy_value
    weight: 2.0
    params: {who: both, days: 20, min_value: 50.0}

  # ── 지수 대비 ────────────────────────────────────────────────
  # 시장이 다 같이 오른 것과 이 종목이 강한 것은 다르다. 시장이 빠질 때
  # 덜 빠진 종목도 강한 것으로 본다.
  - key: relative_strength
    weight: 2.0
    params: {period: 20, min_excess: 0.0}
