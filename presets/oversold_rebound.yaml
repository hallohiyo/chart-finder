name: 과매도 반등 — 많이 빠진 뒤 돌아설 자리
market: kr
universe: all
description: RSI 30 이하 + 볼린저 하단 이탈, 고점 대비 25~60% 조정 구간.
requires: [flows]
order: 20
conditions:
  - key: rsi_oversold
    weight: 4.0
    params: {period: 14, threshold: 30.0}
  - key: bb_lower_touch
    weight: 3.5
    params: {period: 20, mult: 2.0}
  - key: drawdown_range
    weight: 3.0
    params: {period: 252, low: 25.0, high: 60.0}
  - key: turnover_value
    weight: 1.0
    params: {period: 20, min_value: 5.0}

  # ── 수급 ─────────────────────────────────────────────────────
  # 세 가지를 따로 본다. 서로 상관이 거의 없어(r=0.04~0.16) 중복이 아니다.

  # 1) 외국인과 기관이 '같은 날 함께' 담는지. 한쪽이 사고 다른 쪽이 파는
  #    것과 둘이 같이 담는 것은 다르다.
  - key: both_net_buy
    weight: 2.5
    params: {days: 5}

  # 2) 얼마나 많이 — 상장주식수 대비 비중 (주식 수는 종목 크기에 좌우된다)
  - key: net_buy_ratio
    weight: 2.5
    params: {who: both, days: 20, min_pct: 0.3}

  # 3) 실제로 들어온 돈
  - key: net_buy_value
    weight: 2.0
    params: {who: both, days: 20, min_value: 50.0}

  # ── 지수 대비 ────────────────────────────────────────────────
  # 시장이 다 같이 오른 것과 이 종목이 강한 것은 다르다. 시장이 빠질 때
  # 덜 빠진 종목도 강한 것으로 본다.
  - key: relative_strength
    weight: 2.0
    params: {period: 20, min_excess: 0.0}
