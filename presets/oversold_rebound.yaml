name: 과매도 반등 — 많이 빠진 뒤 돌아설 자리
market: kr
universe: all
description: RSI 30 이하 + 볼린저 하단 이탈, 고점 대비 25~60% 조정 구간.
requires: [flows]
order: 20
conditions:
  - key: rsi_oversold
    weight: 2.0
    params: {period: 14, threshold: 30.0}
  - key: bb_lower_touch
    weight: 1.5
    params: {period: 20, mult: 2.0}
  - key: drawdown_range
    weight: 1.0
    params: {period: 252, low: 25.0, high: 60.0}
  - key: min_trading_value
    weight: 1.0
    params: {period: 20, amount: 500.0}

  # ── 수급 확인 ────────────────────────────────────────────────
  # 외국인과 기관이 '같은 날 함께' 담는지. 한쪽이 사고 다른 쪽이 파는 것과
  # 다르다. 수급은 후행 지표라 뽑는 근거가 아니라 확인용이므로 가중치는 낮다.
  - key: both_net_buy
    weight: 1.5
    params: {days: 5}

  # 얼마나 많이 — 상장주식수 대비 비중 (주식 수는 종목 크기에 좌우된다)
  - key: net_buy_ratio
    weight: 1.5
    params: {who: both, days: 20, min_pct: 0.3}
