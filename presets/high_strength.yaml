name: 신고가권 + 상대강도 — 시장을 앞서 달리는 종목
market: kr
universe: all
description: 직전 고점을 실제로 뚫고, 지수보다 강한 종목. 고점 근처에서 막힌 것과 구분한다.
requires: [profiles, flows]
order: 16
conditions:
  # 직전 60일 고점을 실제로 넘어섰는지 — '근처' 와 '뚫음' 은 다르다.
  # 고점 5% 이내(near_high)로만 보면 저항선 아래에서 막혀 돌아선 자리도
  # 만점을 받는다. 돌파를 확인해야 한다.
  - key: breakout_high
    weight: 3.0
    params: {period: 60, within: 5}

  # 52주 범위의 위쪽 20% — 단기 돌파가 52주 기준으로도 높은 자리인지
  - key: price_position
    weight: 1.5
    params: {period: 252, low: 70.0, high: 100.0}

  # 지수보다 확실히 강하다
  - key: relative_strength
    weight: 3.0
    params: {period: 20, min_excess: 5.0}

  # 정배열 — 추세가 살아 있다
  - key: ma_alignment
    weight: 2.0
    params: {p1: 5, p2: 20, p3: 60, p4: 120}

  # 거래대금이 늘면서 오르는지
  - key: turnover_surge
    weight: 2.0
    params: {mult: 1.5, period: 20}

  - key: turnover_to_marcap
    weight: 2.0
    params: {min_pct: 1.0, period: 20}

  - key: turnover_value
    weight: 1.5
    params: {min_value: 30.0, period: 20}

  # 과열 구간은 피한다
  - key: atr_range
    weight: 1.0
    params: {period: 14, low: 2.0, high: 8.0}

  - key: low_dilution
    weight: 1.5
    params: {max_pct: 5.0}

  # ── 수급 확인 ────────────────────────────────────────────────
  # 외국인과 기관이 '같은 날 함께' 담는지. 한쪽이 사고 다른 쪽이 파는 것과
  # 다르다. 수급은 후행 지표라 뽑는 근거가 아니라 확인용이므로 가중치는 낮다.
  - key: both_net_buy
    weight: 1.5
    params: {days: 5}

  # 얼마나 많이 — 상장주식수 대비 비중 (주식 수는 종목 크기에 좌우된다)
  - key: net_buy_ratio
    weight: 1.5
    params: {who: both, days: 20, min_pct: 0.3}
