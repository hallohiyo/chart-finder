name: 재무 우량주
market: kr
universe: all
description: >-
  매출·영업이익이 꾸준히 늘고 수익성·안정성이 받쳐주는 종목.
  `chartfinder update -m kr --fundamentals` 로 재무를 받아둬야 한다.
conditions:
  # 1. 최근 4년 매출액이 해마다 증가
  - key: revenue_growth
    weight: 2.0
    params: {years: 4, min_growth: 0.0}

  # 2. 영업이익도 해마다 증가
  - key: operating_income_growth
    weight: 2.0
    params: {years: 4, min_growth: 0.0}

  # 3. 영업이익률 양호 (최근 3년 평균 8% 이상)
  - key: operating_margin
    weight: 1.5
    params: {min_margin: 8.0, years: 3}

  # 4. 부채비율 안정 (최근 3년 평균 100% 이하)
  - key: debt_ratio
    weight: 1.5
    params: {max_ratio: 100.0, years: 3}

  # 5. ROE 양호 (최근 3년 평균 10% 이상)
  - key: roe
    weight: 1.5
    params: {min_roe: 10.0, years: 3}

  # 6. 영업현금흐름 3년 연속 플러스
  - key: positive_cash_flow
    weight: 1.5
    params: {years: 3}
