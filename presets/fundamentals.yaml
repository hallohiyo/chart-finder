name: 꾸준히 돈 버는 회사
market: kr
universe: all
description: 매출과 이익이 해마다 늘고 빚이 적은 회사.
requires: [fundamentals]
order: 50
conditions:
  # 1. 최근 4년 매출액이 해마다 증가
  - key: revenue_growth
    weight: 2.0
    params: {years: 4, min_growth: 0.0}

  # 2. 영업이익도 해마다 증가
  - key: operating_income_growth
    weight: 2.0
    params: {years: 4, min_growth: 0.0}

  # 3. 영업이익률 양호 (최근 3년 평균 8% 이상)
  - key: operating_margin
    weight: 1.5
    params: {min_margin: 8.0, years: 3}

  # 4. 부채비율 안정 (최근 3년 평균 100% 이하)
  - key: debt_ratio
    weight: 1.5
    params: {max_ratio: 100.0, years: 3}

  # 5. ROE 양호 (최근 3년 평균 10% 이상)
  - key: roe
    weight: 1.5
    params: {min_roe: 10.0, years: 3}

  # 6. 영업현금흐름 3년 연속 플러스
  - key: positive_cash_flow
    weight: 1.5
    params: {years: 3}
