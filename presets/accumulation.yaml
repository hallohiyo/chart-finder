name: 쌍끌이 매집 — 외국인·기관이 같이 담는 종목
market: kr
universe: all
description: 외인·기관이 같은 날 함께, 많이, 점점 더 담는 종목. 비중과 금액으로 본다.
requires: [flows, profiles]
order: 12
conditions:
  # 1. 같은 날 둘이 함께 담는지 — 한쪽이 사고 다른 쪽이 파는 것과 다르다
  - key: both_net_buy
    weight: 3.0
    params: {days: 5}

  # 2. 얼마나 많이 — 상장주식수 대비 비중 (절대 주식 수는 종목 크기에 좌우된다)
  - key: net_buy_ratio
    weight: 3.0
    params: {who: both, days: 20, min_pct: 0.5}

  # 3. 실제로 들어온 돈
  - key: net_buy_value
    weight: 2.0
    params: {who: both, days: 20, min_value: 100.0}

  # 4. 담는 속도가 붙었는지
  - key: net_buy_accelerating
    weight: 2.0
    params: {who: both, short: 5, long: 20, mult: 1.5}

  # 5. 외국인이 꾸준히
  - key: foreign_net_buy
    weight: 1.5
    params: {days: 3}

  # 6. 기관도 꾸준히
  - key: inst_net_buy
    weight: 1.5
    params: {days: 3}

  # 7. 못 팔 종목은 제외
  - key: turnover_value
    weight: 1.5
    params: {min_value: 20.0, period: 20}

  # 8. 잠재 매물 — 매집해도 물량이 쏟아지면 의미가 없다
  - key: low_dilution
    weight: 1.5
    params: {max_pct: 5.0}
