name: 신고가 돌파 + 매물 없음 — 머리 위가 비어 있는 종목
market: kr
universe: all
description: 52주 신고가를 뚫고 위쪽에 팔 물량이 없는 종목. 본전 매물에 막히지 않는다.
requires: [profiles, flows]
order: 14
conditions:
  # 1. 현재가 위에 거래된 물량이 거의 없는지 — 이 전략의 핵심
  #    52주 신고가를 돌파하면 위에서 거래된 적이 없어 0에 가까워진다
  - key: no_overhead_supply
    weight: 4.0
    params: {period: 252, max_pct: 3.0}

  # 2. 실제로 직전 고점을 뚫었는지 ('고점 근처' 와 '뚫음' 은 다르다)
  - key: breakout_high
    weight: 3.0
    params: {period: 120, within: 5}

  # 3. 52주 범위의 위쪽인지
  - key: price_position
    weight: 2.0
    params: {period: 252, low: 85.0, high: 100.0}

  # 4. 돌파에 거래대금이 붙었는지 — 물량 없이 뚫은 건 허수다
  - key: turnover_surge
    weight: 2.5
    params: {mult: 2.0, period: 20}

  # 5. 추세가 살아 있는지
  - key: ma_alignment
    weight: 2.0
    params: {p1: 5, p2: 20, p3: 60, p4: 120}

  # 6. 과열은 피한다 — 이미 많이 뜬 종목은 위험하다
  - key: disparity_range
    weight: 1.5
    params: {period: 20, low: 100.0, high: 120.0}

  # ── 거를 것 ──────────────────────────────────────────────────

  - key: turnover_value
    weight: 1.5
    params: {min_value: 30.0, period: 20}

  - key: low_dilution
    weight: 1.5
    params: {max_pct: 5.0}

  # ── 수급 ─────────────────────────────────────────────────────

  - key: both_net_buy
    weight: 2.5
    params: {days: 5}

  - key: net_buy_ratio
    weight: 2.5
    params: {who: both, days: 20, min_pct: 0.3}

  - key: net_buy_value
    weight: 2.0
    params: {who: both, days: 20, min_value: 50.0}

  # ── 지수 대비 ────────────────────────────────────────────────
  # 시장이 다 같이 오른 것과 이 종목이 강한 것은 다르다. 시장이 빠질 때
  # 덜 빠진 종목도 강한 것으로 본다.
  - key: relative_strength
    weight: 2.0
    params: {period: 20, min_excess: 0.0}
