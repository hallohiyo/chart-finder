name: 갭 이평선 돌파 — 20/60일선을 갭으로 뛰어넘은 종목
market: kr
universe: all
description: 전날 이평선 아래였다가 갭 상승으로 20일선·60일선 위에서 시작한 자리.
requires: [flows, profiles]
order: 18
conditions:
  # 1. 20일선을 갭으로 돌파 — 슬금슬금 올라 넘은 것과 다르다
  - key: gap_over_ma
    weight: 3.0
    params: {period: 20, min_gap: 1.0, within: 3}

  # 2. 60일선도 갭으로 돌파했다면 더 강하다 (가중치는 낮게)
  - key: gap_over_ma
    weight: 1.5
    params: {period: 60, min_gap: 1.0, within: 5}

  # 3. 거래대금 급증 — 갭만 띄우고 거래가 없으면 허수다
  - key: turnover_surge
    weight: 2.5
    params: {mult: 2.0, period: 20}

  # 4. 시총 대비 거래대금
  - key: turnover_to_marcap
    weight: 2.0
    params: {min_pct: 1.0, period: 20}

  # 5. 수급 — 갭은 '누가 담았는지' 가 중요하다. 세력이 띄운 갭과 외국인·
  #    기관이 들어온 갭은 다르다.
  - key: both_net_buy
    weight: 2.5
    params: {days: 3}

  - key: net_buy_ratio
    weight: 2.5
    params: {who: both, days: 20, min_pct: 0.3}

  - key: net_buy_value
    weight: 2.0
    params: {who: both, days: 20, min_value: 50.0}

  # 6. 이격도가 과열은 아닌지 — 갭으로 이미 많이 뜬 종목은 위험하다
  - key: disparity_range
    weight: 1.5
    params: {period: 20, low: 100.0, high: 115.0}

  # 7. 거래대금 하한
  - key: turnover_value
    weight: 1.5
    params: {min_value: 30.0, period: 20}

  - key: low_dilution
    weight: 1.5
    params: {max_pct: 5.0}

  # ── 지수 대비 ────────────────────────────────────────────────
  # 시장이 다 같이 오른 것과 이 종목이 강한 것은 다르다. 시장이 빠질 때
  # 덜 빠진 종목도 강한 것으로 본다.
  - key: relative_strength
    weight: 2.0
    params: {period: 20, min_excess: 0.0}
